<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Bem-vindo</ion-card-title>
        <ion-card-subtitle>Entre ou crie sua conta</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-item fill="outline">
          <ion-label position="floating">Email</ion-label>
          <ion-input
            type="email"
            [value]="email()"
            (ionInput)="email.set($any($event.target).value)">
          </ion-input>
        </ion-item>

        <ion-item fill="outline">
          <ion-label position="floating">Senha</ion-label>
          <ion-input
            type="password"
            [value]="password()"
            (ionInput)="password.set($any($event.target).value)">
          </ion-input>
        </ion-item>

        <ion-button expand="block" shape="round" (click)="login()" [disabled]="isLoading()" class="login-button">
          Entrar
        </ion-button>

        <ion-button expand="block" fill="clear" (click)="register()" [disabled]="isLoading()">
          Criar Conta
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
