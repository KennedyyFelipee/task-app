<ion-header> 
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Minhas Tarefas</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addTask()">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card class="ion-margin-bottom">
    <ion-card-header>
      <ion-card-title>😄 Piada do Dia</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>{{ joke() }}</p>
      <ion-button expand="block" fill="outline" size="small" (click)="loadJoke()">
        Outra piada
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-list lines="none">
    @for (task of tasks(); track task.id) {
      <ion-item-sliding>
        <ion-item>
          <ion-checkbox
            slot="start"
            [checked]="task.completed"
            (ionChange)="toggleTask(task.id)"
            mode="ios">
          </ion-checkbox>
          <ion-label [class.completed]="task.completed">
            <h2>{{ task.title }}</h2>
            <p>{{ task.description }}</p>
          </ion-label>
        </ion-item>

        <ion-item-options side="end">
          <ion-item-option (click)="editTask(task.id, task.title, task.description)">
            <ion-icon name="pencil-sharp"></ion-icon>
          </ion-item-option>
          <ion-item-option (click)="deleteTask(task.id)">
            <ion-icon name="trash-bin-sharp"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-list>

</ion-content>
