<ion-app>
  <ng-container *ngIf="showMenu()">
    <ion-split-pane contentId="main-content" when="md">
      <ion-menu contentId="main-content" type="overlay">
        <ion-header>
          <ion-item lines="none" class="menu-header">
            <ion-label>
              <p>Bem-vindo de volta!</p>
            </ion-label>
          </ion-item>
        </ion-header>

        <ion-content>
          <ion-list>
            <ion-menu-toggle auto-hide="true">
              <ion-item button routerLink="/home" routerDirection="root" lines="none">
                <ion-icon name="home-outline" slot="start"></ion-icon>
                <ion-label>Início</ion-label>
              </ion-item>

              <ion-item button routerLink="/create-task" routerDirection="root" lines="none">
                <ion-icon name="add-circle-outline" slot="start"></ion-icon>
                <ion-label>Criar Tarefa</ion-label>
              </ion-item>

              <ion-item button routerLink="/profile" routerDirection="root" lines="none">
                <ion-icon name="person-outline" slot="start"></ion-icon>
                <ion-label>Perfil</ion-label>
              </ion-item>

              <ion-item button routerLink="/settings" routerDirection="root" lines="none">
                <ion-icon name="settings-outline" slot="start"></ion-icon>
                <ion-label>Configurações</ion-label>
              </ion-item>

              <ion-item button routerLink="/about" routerDirection="root" lines="none">
                <ion-icon name="information-circle-outline" slot="start"></ion-icon>
                <ion-label>Sobre</ion-label>
              </ion-item>

              <ion-item button (click)="logout()" lines="none" color="danger">
                <ion-icon name="log-out-outline" slot="start"></ion-icon>
                <ion-label>Sair</ion-label>
              </ion-item>
            </ion-menu-toggle>
          </ion-list>
        </ion-content>
      </ion-menu>

      <ion-router-outlet id="main-content"></ion-router-outlet>
    </ion-split-pane>
  </ng-container>

  <ng-container *ngIf="!showMenu()">
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ng-container>
</ion-app>
